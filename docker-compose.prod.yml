services:
  # Service 1: Standard PostgreSQL (Future Use)
  postgres-standard:
    image: postgres:16
    container_name: postgres-standard
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: main_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_standard_data:/var/lib/postgresql/data

  # Service 2: PostgreSQL with pgvector extension (Future Use)
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: postgres-vector
    restart: unless-stopped
    environment:
      POSTGRES_USER: vector_admin
      POSTGRES_PASSWORD: vector_password
      POSTGRES_DB: vector_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_vector_data:/var/lib/postgresql/data

  # Service 3: BFF (Backend for Frontend)
  bff:
    build:
      context: ./backend
      dockerfile: Dockerfile.bff
    container_name: bff
    command: /app/bff
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=host=postgres-vector user=vector_admin password=vector_password dbname=vector_db port=5432 sslmode=disable
      - GIN_MODE=release
    depends_on:
      - postgres-vector

  # Service 4: Manager (Background Logic)
  manager:
    build:
      context: ./backend
      dockerfile: Dockerfile.manager
    container_name: manager
    command: /app/manager
    restart: always
    environment:
      - DATABASE_URL=host=postgres-vector user=vector_admin password=vector_password dbname=vector_db port=5432 sslmode=disable
    depends_on:
      - postgres-vector

volumes:
  postgres_standard_data:
  postgres_vector_data:
